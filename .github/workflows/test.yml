name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Moloko99
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Moloko99 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      UMBRACO_CLIENT_ID: umbraco-back-office-mcp
      UMBRACO_CLIENT_SECRET: '1234567890'
      UMBRACO_BASE_URL: https://localhost:44448
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Build
        run: npm run build

      - name: Setup .NET dev certs
        run: dotnet dev-certs https

      - name: Bootstrap demo-site from template
        run: npm run umbraco:bootstrap

      - name: Configure Umbraco for CI
        run: |
          cat > demo-site/appsettings.local.json << 'EOF'
          {
            "ConnectionStrings": {
              "umbracoDbDSN": "Server=localhost,1433;Database=umbraco-engage-mcp-ci;User Id=sa;password=Moloko99;TrustServerCertificate=True",
              "umbracoDbDSN_ProviderName": "Microsoft.Data.SqlClient"
            }
          }
          EOF

      - name: Create database
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P Moloko99 -C \
            -Q "IF DB_ID('umbraco-engage-mcp-ci') IS NULL CREATE DATABASE [umbraco-engage-mcp-ci]"

      - name: Start Umbraco
        run: |
          cd demo-site
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS="http://localhost:44449;https://localhost:44448" \
          dotnet run --no-launch-profile > /tmp/umbraco.log 2>&1 &
          echo $! > /tmp/umbraco.pid

      - name: Wait for Umbraco
        run: |
          echo "Waiting for Umbraco runtime to reach 'Run'..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://localhost:44449/umbraco/management/api/v1/server/status 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('serverStatus',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "Run" ]; then
              echo "Umbraco is ready (serverStatus=Run)"
              exit 0
            fi
            if ! kill -0 $(cat /tmp/umbraco.pid) 2>/dev/null; then
              echo "Umbraco process died! Last 100 lines of log:"
              tail -100 /tmp/umbraco.log
              exit 1
            fi
            echo "Attempt $i/60 - serverStatus='${STATUS:-unreachable}' - waiting 5s..."
            sleep 5
          done
          echo "Umbraco failed to reach 'Run' within 5 minutes. Last 100 lines of log:"
          tail -100 /tmp/umbraco.log
          exit 1
        timeout-minutes: 6

      - name: Create API user
        run: |
          # serverStatus=Run can be reported moments before the backoffice
          # login endpoint is actually ready (Umbraco does a final internal
          # restart after unattended install) - retry through the brief 503 window.
          for i in $(seq 1 10); do
            if node scripts/create-api-user.mjs http://localhost:44449 admin@admin.com 1234567890; then
              exit 0
            fi
            echo "Attempt $i/10 failed - waiting 5s before retry..."
            sleep 5
          done
          exit 1

      - name: Generate Engage reporting tables
        run: |
          # A brand-new install has never run this job, so Engage's reporting/
          # analytics query tables are either missing entirely or empty - several
          # tools (analytics, get-ab-test-empty's daily-visitor lookup) query them
          # unconditionally and error otherwise. Trigger the same background job
          # post-reporting-generation-start starts, then wait for it to finish.
          TOKEN=$(curl -sf -X POST http://localhost:44449/umbraco/management/api/v1/security/back-office/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=umbraco-back-office-mcp&client_secret=1234567890" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          curl -sf -X POST http://localhost:44449/umbraco/engage/management/api/v1/reporting/generation/start \
            -H "Authorization: Bearer $TOKEN"

          for i in $(seq 1 24); do
            STATUS_JSON=$(curl -sf http://localhost:44449/umbraco/engage/management/api/v1/reporting/generation/status \
              -H "Authorization: Bearer $TOKEN")
            EXISTS=$(echo "$STATUS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['reportingTablesExist'] and not d['isGenerating'])")
            if [ "$EXISTS" = "True" ]; then
              echo "Reporting tables generated: $STATUS_JSON"
              exit 0
            fi
            echo "Attempt $i/24 - status='$STATUS_JSON' - waiting 5s..."
            sleep 5
          done
          echo "Reporting generation did not finish within 2 minutes."
          exit 1

      - name: Run tests per collection
        env:
          # goal/__tests__/helpers/sql-cleanup.ts talks to SQL Server directly
          # (no delete-goal API endpoint exists) - point it at this job's
          # service container/database instead of local dev's fixed "sql"
          # container name and "umbraco-engage-mcp" database.
          SQL_CONTAINER_NAME: ${{ job.services.sqlserver.id }}
          SQL_DATABASE_NAME: umbraco-engage-mcp-ci
        run: |
          set +e
          FAILED=0
          for dir in src/umbraco-api/tools/*/; do
            collection=$(basename "$dir")
            if [ ! -d "${dir}__tests__" ]; then
              continue
            fi
            echo "=== ${collection} ==="
            NODE_OPTIONS="--max-old-space-size=4096" node --experimental-vm-modules node_modules/jest/bin/jest.js \
              --runInBand --testPathPattern="tools/${collection}/__tests__"
            if [ $? -ne 0 ]; then
              echo "*** FAILED: ${collection} ***"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: src/umbraco-api/tools/*/__tests__/__snapshots__/*.snap

      - name: Dump Umbraco log on failure
        if: failure()
        run: tail -200 /tmp/umbraco.log || true
